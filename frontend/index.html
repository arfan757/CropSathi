<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CropSathi - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">

  <style>
    body { font-family: 'Noto Sans', sans-serif; background-color: #fbf9f8; color: #1b1c1c; }
    h1, h2, h3, .font-headline { font-family: 'Be Vietnam Pro', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-full bg-[#006038] flex items-center justify-center text-white font-bold shadow-md mx-auto mb-3">
        <i data-lucide="sprout" class="w-8 h-8"></i>
      </div>
      <h1 class="font-headline text-2xl font-bold text-[#006038]" data-i18n="login_title">CropSathi</h1>
      <p class="text-sm text-[#3f4941] mt-1" data-i18n="login_subtitle">Sign in to your account</p>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm border border-[#e4e2e1]">
      <div id="errorBanner" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-sm text-red-700"></div>

      <form id="loginForm" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-[#6f7a71]" data-i18n="login_phone">Phone Number</label>
          <input id="phoneInput" type="tel" placeholder="+91 98765 43210" data-i18n-placeholder="login_phone_placeholder"
                 class="w-full px-4 py-3 rounded-xl border border-[#e4e2e1] bg-[#fbf9f8] text-[#1b1c1c] focus:ring-2 focus:ring-[#006038] outline-none text-sm" required />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-[#6f7a71]" data-i18n="login_password">Password</label>
          <input id="passwordInput" type="password" placeholder="Enter your password" data-i18n-placeholder="login_password_placeholder"
                 class="w-full px-4 py-3 rounded-xl border border-[#e4e2e1] bg-[#fbf9f8] text-[#1b1c1c] focus:ring-2 focus:ring-[#006038] outline-none text-sm" required />
        </div>
        <button type="submit" id="loginBtn"
                class="w-full py-3 bg-[#006038] hover:bg-[#1a7a4c] text-white font-semibold rounded-xl transition shadow-sm">
          <span data-i18n="login_btn">Sign In</span>
        </button>
      </form>

      <div class="mt-4 text-center">
        <p class="text-xs text-[#3f4941]"><span data-i18n="login_no_account">Don't have an account?</span>
          <a href="#" onclick="showRegister()" class="font-semibold text-[#006038] hover:underline"><span data-i18n="login_register">Register</span></a>
        </p>
      </div>
    </div>

    <div id="registerSection" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-[#e4e2e1] mt-4">
      <div id="regErrorBanner" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-sm text-red-700"></div>
      <form id="registerForm" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-[#6f7a71]" data-i18n="reg_title">Full Name</label>
          <input id="regName" type="text" placeholder="Your name" data-i18n-placeholder="reg_name_placeholder"
                 class="w-full px-4 py-3 rounded-xl border border-[#e4e2e1] bg-[#fbf9f8] text-[#1b1c1c] focus:ring-2 focus:ring-[#006038] outline-none text-sm" required />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-[#6f7a71]" data-i18n="login_phone">Phone Number</label>
          <input id="regPhone" type="tel" placeholder="9876543210" data-i18n-placeholder="reg_phone_placeholder"
                 class="w-full px-4 py-3 rounded-xl border border-[#e4e2e1] bg-[#fbf9f8] text-[#1b1c1c] focus:ring-2 focus:ring-[#006038] outline-none text-sm" required />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-[#6f7a71]" data-i18n="login_password">Password</label>
          <input id="regPassword" type="password" placeholder="Min 6 characters" data-i18n-placeholder="reg_password_placeholder"
                 class="w-full px-4 py-3 rounded-xl border border-[#e4e2e1] bg-[#fbf9f8] text-[#1b1c1c] focus:ring-2 focus:ring-[#006038] outline-none text-sm" required />
        </div>
        <button type="submit" class="w-full py-3 bg-[#006038] hover:bg-[#1a7a4c] text-white font-semibold rounded-xl transition shadow-sm">
          <span data-i18n="reg_btn">Create Account</span>
        </button>
      </form>
      <div class="mt-4 text-center">
        <p class="text-xs text-[#3f4941]"><span data-i18n="login_has_account">Already have an account?</span>
          <a href="#" onclick="hideRegister()" class="font-semibold text-[#006038] hover:underline"><span data-i18n="login_signin">Sign In</span></a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="config.js"></script>
  <script src="preferences.js"></script>
  <script>
    lucide.createIcons();

    function showRegister() {
      document.getElementById('loginForm').closest('div.bg-white').classList.add('hidden');
      document.getElementById('registerSection').classList.remove('hidden');
    }
    function hideRegister() {
      document.getElementById('registerSection').classList.add('hidden');
      document.getElementById('loginForm').closest('div.bg-white').classList.remove('hidden');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const banner = document.getElementById('errorBanner');
      btn.disabled = true; btn.textContent = CropSathiPrefs.t('login_signin') + '...';
      banner.classList.add('hidden');

      const phone = document.getElementById('phoneInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      try {
        const res = await fetch(`${CropSathiPrefs.api}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber: phone, password })
        });
        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          banner.textContent = data.message || 'Login failed';
          banner.classList.remove('hidden');
        }
      } catch (err) {
        banner.textContent = 'Cannot reach server';
        banner.classList.remove('hidden');
      }
      btn.disabled = false;
      btn.innerHTML = '<span data-i18n="login_btn">' + CropSathiPrefs.t('login_btn') + '</span>';
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const banner = document.getElementById('regErrorBanner');
      banner.classList.add('hidden');

      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;

      try {
        const res = await fetch(`${CropSathiPrefs.api}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phoneNumber: phone, password })
        });
        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          banner.textContent = data.message || 'Registration failed';
          banner.classList.remove('hidden');
        }
      } catch (err) {
        banner.textContent = 'Cannot reach server';
        banner.classList.remove('hidden');
      }
    });

    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
