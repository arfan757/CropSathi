<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notifications — CropSathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui.css">
  <style>
    body { font-family: 'Noto Sans', sans-serif; background: #fbf9f8; }
    .font-headline { font-family: 'Be Vietnam Pro', sans-serif; }

    /* Page layout */
    .np-wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 100px; }

    /* Page header */
    .np-page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px;
      gap: 12px;
    }
    .np-page-title { font-family: 'Be Vietnam Pro', sans-serif; font-size: 22px; font-weight: 700; color: #1b1c1c; }
    .np-badge-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px; height: 22px;
      border-radius: 11px;
      background: #dc2626;
      color: white;
      font-size: 11px; font-weight: 700;
      padding: 0 6px;
    }
    .np-btn-clear {
      font-size: 13px; font-weight: 600;
      color: #dc2626;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .np-btn-clear:hover { background: #fee2e2; }

    /* Section label */
    .section-label {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #9ca3a2;
      margin: 20px 0 10px;
    }

    /* Notification card */
    .np-card {
      background: white;
      border: 1px solid #e4e2e1;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      overflow: hidden;
      margin-bottom: 10px;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }
    .np-card:active { transform: scale(0.985); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .np-card.unread { border-left: 4px solid #006038; }
    .np-card-inner { padding: 14px 16px; }

    /* Card header row */
    .np-card-row { display: flex; align-items: flex-start; gap: 12px; }
    .np-icon-wrap {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: #f0f3f2;
      display: flex; align-items: center; justify-content: center;
      color: #006038;
      flex-shrink: 0;
    }
    .np-icon-wrap.is-urgent { background: #fee2e2; color: #dc2626; }
    .np-icon-wrap.is-high { background: #fef3c7; color: #b45309; }
    .np-meta { flex: 1; min-width: 0; }
    .np-title { font-weight: 600; font-size: 14.5px; color: #1b1c1c; line-height: 1.3; }
    .np-sub { font-size: 11.5px; color: #9ca3a2; margin-top: 1px; }
    .np-time { font-size: 11px; color: #9ca3a2; white-space: nowrap; margin-left: auto; flex-shrink: 0; }

    /* Card body */
    .np-message { font-size: 13px; color: #3f4941; margin-top: 6px; line-height: 1.45; }

    /* Action row */
    .np-action-row {
      display: flex; gap: 8px;
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid #f0f0f0;
    }
    .np-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #e4e2e1;
      background: #f6f3f2;
      font-size: 12px; font-weight: 600;
      color: #3f4941;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
      display: block;
    }
    .np-btn:active { background: #eae8e7; }
    .np-btn.is-primary {
      background: #006038;
      color: white;
      border-color: #006038;
    }
    .np-btn.is-primary:active { background: #1a7a4c; }

    /* Priority pill */
    .np-priority {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .np-priority.is-urgent { background: #fee2e2; color: #dc2626; }
    .np-priority.is-high { background: #fef3c7; color: #b45309; }
    .np-priority.is-medium { background: #f0fdf4; color: #16a34a; }
    .np-priority.is-low { background: #f6f3f2; color: #9ca3a2; }

    /* Empty state */
    .np-empty {
      text-align: center;
      padding: 60px 20px;
    }
    .np-empty-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: #f0f0f0;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .np-empty h3 { font-family: 'Be Vietnam Pro', sans-serif; font-size: 18px; font-weight: 700; color: #1b1c1c; margin-bottom: 6px; }
    .np-empty p { font-size: 13.5px; color: #6f7a71; }

    /* Loading spinner */
    .np-loading { text-align: center; padding: 80px 20px; }
    .np-spinner {
      width: 36px; height: 36px;
      border: 3px solid #e4e2e1;
      border-top-color: #006038;
      border-radius: 50%;
      animation: np-spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes np-spin { to { transform: rotate(360deg); } }
    .np-loading p { font-size: 13px; color: #6f7a71; }

    /* Swipe hint */
    .swipe-hint { text-align: center; font-size: 11px; color: #c0c0c0; padding: 4px 0 12px; }
  </style>
</head>
<body class="min-h-screen">

  <!-- ======= Shared top bar (matches other pages) ======= -->
  <header class="np-header-bar">
    <a href="dashboard.html" class="np-back-btn" aria-label="Back to Dashboard">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </a>
    <h1 class="np-page-title">Notifications</h1>
    <span id="np-badge-top" class="np-badge-chip hidden"></span>
    <button onclick="clearAllNotifications()" class="np-btn-clear">Clear all</button>
  </header>

  <!-- ======= Page body ======= -->
  <div class="np-wrap">

    <!-- Loading -->
    <div id="np-loading" class="np-loading">
      <div class="np-spinner"></div>
      <p>Loading notifications...</p>
    </div>

    <!-- Today's section -->
    <div id="np-today-wrap" class="hidden">
      <div class="section-label">Today</div>
      <div id="np-today"></div>
    </div>

    <!-- Earlier section -->
    <div id="np-earlier-wrap" class="hidden">
      <div class="section-label">Earlier</div>
      <div id="np-earlier"></div>
    </div>

    <!-- Empty state -->
    <div id="np-empty" class="np-empty hidden">
      <div class="np-empty-icon">
        <i data-lucide="bell-off" class="w-7 h-7 text-[#9ca3a2]"></i>
      </div>
      <h3>All caught up</h3>
      <p>No notifications right now. You're all set!</p>
    </div>

  </div>

  <!-- ======= Bottom tab bar (matches other pages) ======= -->
  <nav class="cs-tabbar md:hidden" aria-label="Primary">
    <a class="cs-tab" href="dashboard.html">
      <span class="cs-tab-icon"><i data-lucide="layout-grid" aria-hidden="true"></i></span>
      <span class="cs-tab-label">Dashboard</span>
    </a>
    <a class="cs-tab" href="my-fields.html">
      <span class="cs-tab-icon"><i data-lucide="map-pin" aria-hidden="true"></i></span>
      <span class="cs-tab-label">My Fields</span>
    </a>
    <a class="cs-tab" href="diagnose.html">
      <span class="cs-tab-icon"><i data-lucide="camera" aria-hidden="true"></i></span>
      <span class="cs-tab-label">Diagnose</span>
    </a>
    <a class="cs-tab" href="advisory.html">
      <span class="cs-tab-icon"><i data-lucide="lightbulb" aria-hidden="true"></i></span>
      <span class="cs-tab-label">Advisory</span>
    </a>
    <a class="cs-tab" href="settings.html">
      <span class="cs-tab-icon"><i data-lucide="settings" aria-hidden="true"></i></span>
      <span class="cs-tab-label">Settings</span>
    </a>
  </nav>

  <!-- Desktop sidebar (matches other pages) -->
  <aside class="np-sidebar">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-full bg-[#006038] flex items-center justify-center text-white shadow-md">
        <i data-lucide="sprout" class="w-5 h-5"></i>
      </div>
      <span class="font-headline font-bold text-lg tracking-tight text-[#006038]">CropSathi</span>
    </div>
    <nav class="space-y-1">
      <a href="dashboard.html" class="np-nav-item"><i data-lucide="layout-grid" class="w-5 h-5"></i><span>Dashboard</span></a>
      <a href="my-fields.html" class="np-nav-item"><i data-lucide="map-pin" class="w-5 h-5"></i><span>My Fields</span></a>
      <a href="diagnose.html" class="np-nav-item"><i data-lucide="camera" class="w-5 h-5"></i><span>Diagnose</span></a>
      <a href="advisory.html" class="np-nav-item"><i data-lucide="lightbulb" class="w-5 h-5"></i><span>Advisory</span></a>
      <a href="notifications.html" class="np-nav-item is-active"><i data-lucide="bell" class="w-5 h-5"></i><span>Notifications</span></a>
      <a href="analytics.html" class="np-nav-item"><i data-lucide="bar-chart-2" class="w-5 h-5"></i><span>Analytics</span></a>
      <a href="settings.html" class="np-nav-item"><i data-lucide="settings" class="w-5 h-5"></i><span>Settings</span></a>
    </nav>
  </aside>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="config.js"></script>

  <style>
    /* Header bar (mobile) */
    .np-header-bar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(251,249,248,0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .np-back-btn {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      color: #006038;
      text-decoration: none;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .np-back-btn:hover { background: #f0f3f2; }

    /* Nav sidebar (desktop) */
    .np-sidebar {
      display: none;
    }
    @media (min-width: 768px) {
      body { display: grid; grid-template-columns: 240px 1fr; }
      .np-header-bar { display: none; }
      .cs-tabbar { display: none; }
      .np-sidebar {
        display: flex;
        flex-direction: column;
        padding: 24px 16px;
        border-right: 1px solid #e4e2e1;
        background: #f6f3f2;
        height: 100vh;
        position: sticky; top: 0;
        overflow-y: auto;
      }
      .np-wrap { padding-top: 16px; }
    }
    .np-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      color: #3f4941;
      font-size: 14px; font-weight: 500;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .np-nav-item:hover { background: #eae8e7; }
    .np-nav-item.is-active { background: #006038; color: white; }
  </style>

  <script>
    const API = (window.CROPSATHI_API_URL || 'https://cropsathi-x5fe.onrender.com');
    const token = localStorage.getItem('token');

    let notificationsData = [];

    // ---- fetch ----
    async function fetchNotifications() {
      try {
        const res = await fetch(API + '/api/notifications?limit=50', {
          headers: { Authorization: 'Bearer ' + token }
        });
        notificationsData = res.ok ? await res.json() : [];
      } catch (e) {
        notificationsData = [];
      }
    }

    async function fetchUnreadCount() {
      try {
        const res = await fetch(API + '/api/notifications/unread-count', {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (res.ok) {
          const data = await res.json();
          const badge = document.getElementById('np-badge-top');
          if (badge) {
            badge.textContent = data.count || 0;
            badge.classList.toggle('hidden', !(data.count > 0));
          }
        }
      } catch (e) {}
    }

    // ---- render ----
    function renderNotifications() {
      const todayStr = new Date().toISOString().split('T')[0];
      const list = notificationsData || [];

      const todayNotifs = list.filter(n => new Date(n.createdAt).toISOString().split('T')[0] === todayStr);
      const earlierNotifs = list.filter(n => new Date(n.createdAt).toISOString().split('T')[0] !== todayStr);

      document.getElementById('np-loading').classList.add('hidden');
      document.getElementById('np-today-wrap').classList.toggle('hidden', todayNotifs.length === 0);
      document.getElementById('np-earlier-wrap').classList.toggle('hidden', earlierNotifs.length === 0);
      document.getElementById('np-empty').classList.toggle('hidden', list.length > 0);

      document.getElementById('np-today').innerHTML = todayNotifs.map(renderCard).join('');
      document.getElementById('np-earlier').innerHTML = earlierNotifs.map(renderCard).join('');

      lucide.createIcons();
    }

    function renderCard(n) {
      const iconMap = {
        advisory_ready: 'lightbulb',
        remedy_reminder: 'pill',
        reapplication_reminder: 'repeat',
        follow_up_check: 'clipboard-check',
        harvest_safety_wait: 'alert-triangle',
        escalation_alert: 'alert-circle',
        weather_alert: 'cloud-rain'
      };
      const iconName = iconMap[n.type] || 'bell';

      const priorityClass = n.priority === 'urgent' ? 'is-urgent'
        : n.priority === 'high' ? 'is-high'
        : n.priority === 'medium' ? 'is-medium' : 'is-low';

      const iconWrapClass = n.priority === 'urgent' ? 'is-urgent'
        : n.priority === 'high' ? 'is-high' : '';

      const unreadClass = n.read ? '' : 'unread';
      const timeStr = formatTime(new Date(n.createdAt));
      const deepLink = n.deepLink || '#';

      return `
        <div class="np-card ${unreadClass}" onclick="handleNotificationClick('${n._id}', '${deepLink}')">
          <div class="np-card-inner">
            <div class="np-card-row">
              <div class="np-icon-wrap ${iconWrapClass}">
                <i data-lucide="${iconName}" class="w-5 h-5"></i>
              </div>
              <div class="np-meta">
                <div class="np-title">${escapeHtml(n.title || n.type.replace(/_/g, ' '))}</div>
                <div class="np-sub">${escapeHtml((n.type || '').replace(/_/g, ' '))} · ${timeStr}</div>
              </div>
              <span class="np-priority ${priorityClass}">${n.priority || 'low'}</span>
            </div>
            ${n.body ? `<div class="np-message">${escapeHtml(n.body)}</div>` : ''}
            <div class="np-action-row">
              <button onclick="event.stopPropagation(); markRead('${n._id}')" class="np-btn">Mark read</button>
              <a href="${deepLink}" onclick="event.stopPropagation()" class="np-btn is-primary">Open</a>
            </div>
          </div>
        </div>
      `;
    }

    function formatTime(date) {
      const diff = Math.floor((Date.now() - date) / 1000);
      if (diff < 60) return 'Just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text || '';
      return d.innerHTML;
    }

    // ---- actions ----
    async function markRead(id) {
      try {
        await fetch(API + '/api/notifications/' + id + '/read', {
          method: 'PATCH',
          headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }
        });
      } catch (e) {}
      await fetchNotifications();
      await fetchUnreadCount();
      renderNotifications();
    }

    function handleNotificationClick(id, deepLink) {
      markRead(id);
      if (deepLink && deepLink !== '#') {
        setTimeout(() => { window.location.href = deepLink; }, 150);
      }
    }

    async function clearAllNotifications() {
      try {
        await fetch(API + '/api/notifications/clear-all', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }
        });
      } catch (e) {}
      await fetchNotifications();
      await fetchUnreadCount();
      renderNotifications();
    }

    // ---- boot ----
    document.addEventListener('DOMContentLoaded', async () => {
      await fetchNotifications();
      await fetchUnreadCount();
      renderNotifications();
      lucide.createIcons();
    });
  </script>
</body>
</html>
