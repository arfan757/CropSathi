<body class="bg-[#fbf9f8] text-[#1b1c1c] min-h-screen flex has-tabbar">

      <div class="flex items-center gap-3 mb-10">

        <a href="diagnose.html" class="flex items-center gap-3 px-4 py-3 text-[#3f4941] hover:bg-[#eae8e7] rounded-xl font-medium transition"><i data-lucide="camera" class="w-5 h-5"></i><span data-i18n="nav_diagnose">Diagnose</span></a>
        <a href="advisory.html" class="flex items-center gap-3 px-4 py-3 text-[#3f4941] hover:bg-[#eae8e7] rounded-xl font-medium transition"><i data-lucide="lightbulb" class="w-5 h-5"></i><span data-i18n="nav_advisory">Advisory</span></a>
      </nav>
    </div>
    <div class="pt-6 border-t border-[#e4e2e1]">
      <a href="settings.html" class="flex items-center gap-3 px-4 py-3 text-[#3f4941] hover:bg-[#eae8e7] rounded-xl font-medium transition"><i data-lucide="settings" class="w-5 h-5"></i><span data-i18n="nav_settings">Settings</span></a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 w-full overflow-x-hidden p-4 pb-24 md:p-10 md:pb-10 max-w-7xl mx-auto overflow-y-auto md:ml-64">
    <header class="flex flex-wrap items-center justify-between gap-x-3 gap-y-3 mb-6 md:mb-8">

      <!-- Brand lockup — mobile top app bar -->
      <a href="dashboard.html" class="cs-brand md:hidden order-1 flex items-center gap-2.5" aria-label="CropSathi">
        <span class="cs-brand-mark w-10 h-10"><i data-lucide="sprout" class="w-5 h-5"></i></span>
        <span class="font-headline font-bold text-lg tracking-tight text-[#006038]">CropSathi</span>
      </a>

      <!-- Title -->
      <div class="order-3 md:order-2 w-full md:w-auto md:flex-1 min-w-0">
        <h1 class="text-2xl md:text-3xl font-bold font-headline">Notifications</h1>
        <p class="text-[#3f4941] text-sm mt-1">Stay updated on your fields and advisories</p>
      </div>

      <!-- Actions -->
      <div class="order-2 md:order-3 flex items-center gap-2.5 md:gap-4 ml-auto md:ml-0 flex-shrink-0">
        <button type="button" id="clearAllBtn" class="text-sm font-semibold text-[#dc2626] hover:text-white hover:bg-[#dc2626] border border-[#dc2626]/30 hover:border-[#dc2626] px-4 py-2 rounded-xl transition hidden">Clear all</button>
        <div class="user-menu">
          <button type="button" class="user-menu-trigger" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">
            <span id="navProfilePhoto" class="w-11 h-11 rounded-full bg-[#eae8e7] flex items-center justify-center overflow-hidden border-2 border-[#ffffff] shadow-sm flex-shrink-0">
              <span id="navAvatarInitial" class="font-headline text-lg font-bold text-[#006038]"></span>
            </span>
            <i data-lucide="chevron-down" class="user-menu-caret" aria-hidden="true"></i>
          </button>
          <div class="user-menu-panel" role="menu" aria-label="Account menu" aria-hidden="true">
            <div class="user-menu-head">
              <span class="user-menu-head-photo" id="userMenuPhoto" aria-hidden="true">F</span>
              <span class="user-menu-head-meta">
                <span class="user-menu-head-name" id="userMenuName">Farmer</span>
                <span class="user-menu-head-sub" id="userMenuSub">Signed in</span>
              </span>
            </div>
            <a class="user-menu-item" role="menuitem" href="settings.html"><i data-lucide="settings" aria-hidden="true"></i><span class="um-item-label">Settings</span></a>
            <span class="user-menu-sep" role="separator"></span>
            <button type="button" class="user-menu-item is-danger" role="menuitem" data-menu-logout><i data-lucide="log-out" aria-hidden="true"></i><span class="um-item-label">Sign out</span></button>
          </div>
        </div>
      </div>
    </header>

    <!-- Loading skeleton -->
    <div id="notif-loading" class="space-y-4">
      <div class="bg-white border border-[#e4e2e1] rounded-2xl p-5 animate-pulse">
        <div class="flex items-start gap-4">
          <div class="w-11 h-11 rounded-xl bg-[#f0eded] shrink-0"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 bg-[#f0eded] rounded w-3/4"></div>
            <div class="h-3 bg-[#f0eded] rounded w-1/2"></div>
          </div>
        </div>
      </div>
      <div class="bg-white border border-[#e4e2e1] rounded-2xl p-5 animate-pulse">
        <div class="flex items-start gap-4">
          <div class="w-11 h-11 rounded-xl bg-[#f0eded] shrink-0"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 bg-[#f0eded] rounded w-2/3"></div>
            <div class="h-3 bg-[#f0eded] rounded w-2/5"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Today section -->
    <div id="section-today" class="hidden">
      <h2 class="text-xs font-bold uppercase tracking-wider text-[#9ca3a2] mb-3">Today</h2>
      <div id="list-today" class="space-y-3 mb-6"></div>
    </div>

    <!-- Earlier section -->
    <div id="section-earlier" class="hidden">
      <h2 class="text-xs font-bold uppercase tracking-wider text-[#9ca3a2] mb-3">Earlier</h2>
      <div id="list-earlier" class="space-y-3 mb-6"></div>
    </div>

    <!-- Empty state -->
    <div id="notif-empty" class="hidden text-center py-16">
      <div class="w-16 h-16 rounded-full bg-[#f0eded] flex items-center justify-center mx-auto mb-4">
        <i data-lucide="bell-off" class="w-7 h-7 text-[#9ca3a2]"></i>
      </div>
      <h3 class="font-headline font-bold text-lg text-[#1b1c1c] mb-1">All caught up</h3>
      <p class="text-sm text-[#6f7a71]">No notifications right now. You're all set!</p>
    </div>

  </main>

  <!-- Bottom navigation (mobile only) -->
  <nav class="cs-tabbar md:hidden" aria-label="Primary">
    <a class="cs-tab" href="dashboard.html">
      <span class="cs-tab-icon"><i data-lucide="layout-grid" aria-hidden="true"></i></span>
      <span class="cs-tab-label" data-i18n="nav_dashboard">Dashboard</span>
    </a>
    <a class="cs-tab" href="my-fields.html">
      <span class="cs-tab-icon"><i data-lucide="map-pin" aria-hidden="true"></i></span>
      <span class="cs-tab-label" data-i18n="nav_my_fields">My Fields</span>
    </a>
    <a class="cs-tab" href="diagnose.html">
      <span class="cs-tab-icon"><i data-lucide="camera" aria-hidden="true"></i></span>
      <span class="cs-tab-label" data-i18n="nav_diagnose">Diagnose</span>
    </a>
    <a class="cs-tab" href="advisory.html">
      <span class="cs-tab-icon"><i data-lucide="lightbulb" aria-hidden="true"></i></span>
      <span class="cs-tab-label" data-i18n="nav_advisory">Advisory</span>
    </a>
    <a class="cs-tab" href="settings.html">
      <span class="cs-tab-icon"><i data-lucide="settings" aria-hidden="true"></i></span>
      <span class="cs-tab-label" data-i18n="nav_settings">Settings</span>
    </a>
  </nav>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="config.js"></script>
  <script src="preferences.js"></script>
  <script src="ui.js"></script>

  <script>
    const API = window.CROPSATHI_API_URL || 'https://cropsathi-x5fe.onrender.com';
    const token = localStorage.getItem('token');
    let notificationsData = [];

    // ---- fetch ----
    async function fetchNotifications() {
      try {
        const res = await fetch(API + '/api/notifications?limit=50', {
          headers: { Authorization: 'Bearer ' + token }
        });
        const body = res.ok ? await res.json() : {};
        notificationsData = body.notifications || body.data || [];
      } catch (e) {
        notificationsData = [];
      }
    }

    async function fetchUnreadCount() {
      try {
        const res = await fetch(API + '/api/notifications/unread-count', {
          headers: { Authorization: 'Bearer ' + token }
        });
        if (res.ok) {
          const data = await res.json();
          const count = data.count || 0;
          // Update clear all button visibility
          const clearBtn = document.getElementById('clearAllBtn');
          if (clearBtn) clearBtn.classList.toggle('hidden', count === 0 && notificationsData.length === 0);
        }
      } catch (e) {}
    }

    // ---- render ----
    function renderNotifications() {
      const todayStr = new Date().toISOString().split('T')[0];
      const list = notificationsData || [];

      const todayNotifs = list.filter(n => new Date(n.createdAt).toISOString().split('T')[0] === todayStr);
      const earlierNotifs = list.filter(n => new Date(n.createdAt).toISOString().split('T')[0] !== todayStr);

      document.getElementById('notif-loading')?.classList.add('hidden');
      document.getElementById('section-today')?.classList.toggle('hidden', todayNotifs.length === 0);
      document.getElementById('section-earlier')?.classList.toggle('hidden', earlierNotifs.length === 0);
      document.getElementById('notif-empty')?.classList.toggle('hidden', list.length > 0);

      document.getElementById('list-today').innerHTML = todayNotifs.map(renderCard).join('');
      document.getElementById('list-earlier').innerHTML = earlierNotifs.map(renderCard).join('');

      // Show clear all button if there are notifications
      const clearBtn = document.getElementById('clearAllBtn');
      if (clearBtn) clearBtn.classList.toggle('hidden', list.length === 0);

      lucide.createIcons();
    }

    function renderCard(n) {
      const iconMap = {
        advisory_ready: 'lightbulb',
        remedy_reminder: 'pill',
        reapplication_reminder: 'repeat',
        follow_up_check: 'clipboard-check',
        harvest_safety_wait: 'alert-triangle',
        escalation_alert: 'alert-circle',
        weather_alert: 'cloud-rain',
        photo_prompt: 'camera'
      };
      const iconName = iconMap[n.type] || 'bell';

      const priorityColors = {
        urgent: { bg: 'bg-red-50', text: 'text-red-600', border: 'border-red-200', iconBg: 'bg-red-100', iconText: 'text-red-600' },
        high: { bg: 'bg-amber-50', text: 'text-amber-600', border: 'border-amber-200', iconBg: 'bg-amber-100', iconText: 'text-amber-600' },
        medium: { bg: 'bg-green-50', text: 'text-green-600', border: 'border-green-200', iconBg: 'bg-[#f0f3f2]', iconText: 'text-[#006038]' },
        low: { bg: 'bg-[#f0eded]', text: 'text-[#6f7a71]', border: 'border-[#e4e2e1]', iconBg: 'bg-[#f0eded]', iconText: 'text-[#6f7a71]' },
      };
      const pc = priorityColors[n.priority] || priorityColors.low;

      const unreadBorder = n.read ? 'border-[#e4e2e1]' : 'border-l-4 border-l-[#006038] border-[#e4e2e1]';
      const unreadDot = n.read ? '' : '<span class="w-2 h-2 rounded-full bg-[#006038] shrink-0 mt-1.5"></span>';
      const timeStr = formatTime(new Date(n.createdAt));
      const deepLink = n.deepLink || '#';

      return `
        <div class="bg-white border ${unreadBorder} rounded-2xl p-4 tactile-card cursor-pointer hover:shadow-md transition-shadow"
             onclick="handleNotificationClick('${n._id}', '${deepLink}')">
          <div class="flex items-start gap-3.5">
            <div class="w-11 h-11 rounded-xl ${pc.iconBg} flex items-center justify-center ${pc.iconText} shrink-0">
              <i data-lucide="${iconName}" class="w-5 h-5"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-0.5">
                ${unreadDot}
                <h3 class="font-semibold text-sm text-[#1b1c1c] leading-snug truncate">${escapeHtml(n.title || n.type?.replace(/_/g, ' ') || 'Notification')}</h3>
              </div>
              <div class="flex items-center gap-2 text-xs text-[#6f7a71]">
                <span class="capitalize">${escapeHtml((n.type || '').replace(/_/g, ' '))}</span>
                <span>·</span>
                <span>${timeStr}</span>
              </div>
              ${n.body ? `<p class="text-[13px] text-[#3f4941] mt-2 leading-relaxed" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${escapeHtml(n.body)}</p>` : ''}
              <div class="flex items-center gap-2 mt-3 pt-3 border-t border-[#f0eded]">
                <button onclick="event.stopPropagation(); markRead('${n._id}')"
                        class="flex-1 text-center text-xs font-semibold py-2 px-3 rounded-xl border border-[#e4e2e1] bg-[#f6f3f2] text-[#3f4941] hover:bg-[#eae8e7] transition">
                  Mark read
                </button>
                <a href="${deepLink}" onclick="event.stopPropagation()"
                   class="flex-1 text-center text-xs font-semibold py-2 px-3 rounded-xl bg-[#006038] text-white hover:bg-[#1a7a4c] transition">
                  Open
                </a>
              </div>
            </div>
            <span class="text-[10px] font-bold uppercase tracking-wide ${pc.text} ${pc.bg} px-2 py-1 rounded-lg shrink-0">${n.priority || 'low'}</span>
          </div>
        </div>
      `;
    }

    function formatTime(date) {
      const diff = Math.floor((Date.now() - date) / 1000);
      if (diff < 60) return 'Just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text || '';
      return d.innerHTML;
    }

    // ---- actions ----
    async function markRead(id) {
      try {
        await fetch(API + '/api/notifications/' + id + '/read', {
          method: 'PATCH',
          headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }
        });
      } catch (e) {}
      await fetchNotifications();
      await fetchUnreadCount();
      renderNotifications();
    }

    function handleNotificationClick(id, deepLink) {
      markRead(id);
      if (deepLink && deepLink !== '#') {
        setTimeout(() => { window.location.href = deepLink; }, 150);
      }
    }

    async function clearAllNotifications() {
      try {
        await fetch(API + '/api/notifications/clear-all', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }
        });
      } catch (e) {}
      await fetchNotifications();
      await fetchUnreadCount();
      renderNotifications();
    }

    // ---- boot ----
    document.addEventListener('DOMContentLoaded', async () => {
      if (!token) { window.location.href = 'login.html'; return; }

      document.getElementById('clearAllBtn')?.addEventListener('click', clearAllNotifications);

      await fetchNotifications();
      await fetchUnreadCount();
      renderNotifications();
    });
  </script>
</body>
</html>
