services:
  - type: web
    name: cropsathi-backend
    runtime: node
    region: oregon  # frankfurt, singapore, mumbai also available
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Set these in Render Dashboard → Environment:
      # SUPABASE_URL=https://your-project.supabase.co
      # SUPABASE_SERVICE_ROLE_KEY=your_supabase_service_role_key
      # JWT_SECRET=your_secure_jwt_secret
      # CORS_ORIGIN=https://your-cropsathi-app.vercel.app
      # GEMINI_API_KEY=AIzaSy...
      # COPENICUS_CLIENT_ID=your_copernicus_client_id
      # COPENICUS_CLIENT_SECRET=your_copernicus_client_secret
      # ML_SERVICE_URL=http://cropsathi-ml:10000 or https://cropsathi-ml.onrender.com
      - key: ML_SERVICE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

  # Dual-model plant disease detection (Pure ONNX Runtime).
  # 1. cropsathi_v1.onnx: Cotton, Rice, Tomato (27 classes, 288x288, temperature-calibrated)
  # 2. plantvillage_38.onnx: 14 crops (38 classes, 128x128)
  - type: web
    name: cropsathi-ml
    runtime: python@3.11
    region: oregon
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
