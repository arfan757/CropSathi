services:
  - type: web
    name: cropsathi-backend
    runtime: node
    region: oregon  # frankfurt, singapore, mumbai also available
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Set these in Render Dashboard → Environment:
      # MONGODB_URI=mongodb+srv://...
      # JWT_SECRET=your_secret_key
      # GEMINI_API_KEY=AIza...
      # CORS_ORIGIN=https://your-frontend.vercel.app
      # COPENICUS_CLIENT_ID / COPENICUS_CLIENT_SECRET — free OAuth client
      # credentials from Copernicus Data Space (register at
      # dataspace.copernicus.eu, then create an OAuth client). REQUIRED for
      # real satellite data: Sentinel-2 NDVI/NDRE AND Landsat 8/9 thermal
      # (LST). Without them the backend serves simulated/formula fallbacks.
    healthCheckPath: /api/health
    autoDeploy: true
