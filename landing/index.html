<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CropSathi — Early Crop Disease Detection & Satellite Field Intelligence</title>
    <meta name="description" content="CropSathi bridges satellite remote sensing with AI leaf pathology diagnostics to flag crop stress, water deficits, and disease outbreaks before damage is irreversible." />
    <meta property="og:title" content="CropSathi — Early Crop Disease Detection & Satellite Field Intelligence" />
    <meta property="og:description" content="Catch crop disease days before the damage shows. Satellite + AI leaf diagnostics for smallholder farmers." />

    <meta name="twitter:description" content="Catch crop disease days before the damage shows. Satellite + AI leaf diagnostics for smallholder farmers." />
    <script>
      (function () {
        function getCookie(name) {
          var match = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
          return match ? decodeURIComponent(match[1]) : null;
        }

        function getToken() {
          try {
            return localStorage.getItem('token') || getCookie('cropsathi_token');
          } catch (e) {
            return getCookie('cropsathi_token');
          }
        }

        function decodePayload(token) {
          try {
            var parts = token.split('.');
            if (parts.length !== 3) return null;
            var base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4 !== 0) base64 += '=';
            return JSON.parse(window.atob(base64));
          } catch (e) {
            return null;
          }
        }

        function clearToken() {
          try { localStorage.removeItem('token'); } catch (e) {}
          document.cookie = 'cropsathi_token=; path=/; max-age=0; SameSite=Lax';
        }

        var token = getToken();
        if (!token) return;

        var payload = decodePayload(token);
        if (payload && typeof payload.exp === 'number' && payload.exp * 1000 > Date.now()) {
          window.location.replace('/dashboard.html');
        } else {
          clearToken();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
